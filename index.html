<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rift Legion TD — Defiende la Grieta</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<canvas id="c"></canvas>
<div id="floaters"></div>

<div id="hud" class="hidden">
  <div id="top">
    <div class="nexbar left"><div class="nlabel" id="t0name">NEXO AZUL</div><div class="bar"><i id="hp0"></i><b id="hp0t"></b></div><div class="nup" id="nup0"></div></div>
    <div id="center">
      <div id="waveName"></div>
      <div id="timer">0</div>
      <div id="phaseLbl">CONSTRUCCIÓN</div>
    </div>
    <div class="nexbar right"><div class="nlabel" id="t1name">NEXO ROJO</div><div class="bar red"><i id="hp1"></i><b id="hp1t"></b></div><div class="nup" id="nup1"></div></div>
  </div>
  <div id="eco">
    <div class="pill gold" title="Oro: campeones, mejoras y poros"><span class="ico">◆</span><b id="gold">0</b><small>oro</small></div>
    <div class="pill myth" title="Esencia Hextech: la generan los poros; sirve para mercenarios y mejoras del Nexo"><span class="ico">✦</span><b id="myth">0</b><small id="mythRate">esencia</small></div>
    <div class="pill inc" title="Oro que recibes al terminar cada oleada"><span class="ico">▲</span><b id="income">0</b><small>/oleada</small></div>
    <div class="pill val" title="Valor de tu ejército frente al recomendado para la oleada"><span class="ico">⚔</span><b id="value">0</b><small id="rec">/ 0 rec.</small></div>
  </div>
  <div id="players"></div>
  <div id="ctrls">
    <button id="bView">Ver otra línea <kbd>Tab</kbd></button>
    <button id="bSpeed">Velocidad ×1 <kbd>F</kbd></button>
    <button id="bPanels" title="O / G / T">Paneles <kbd>O G T</kbd></button>
    <button id="bMute">Sonido</button>
    <button id="bQuit">Salir</button>
  </div>
  <div id="left">
    <div id="next"></div>
    <div id="info" class="hidden"></div>
  </div>
  <div id="right">
    <div class="tabs"><button data-tab="mercs" class="on">Mercenarios</button><button data-tab="nexus">Nexo</button></div>
    <div id="tabMercs"><div class="hint" id="mercTarget"></div><div id="mercs"></div></div>
    <div id="tabNexus" class="hidden"><div class="hint">Mejoras compartidas por el equipo (esencia)</div><div id="nexusUps"></div></div>
    <button id="bPoro" class="poro"></button>
  </div>
  <div id="bottom">
    <div id="shop"></div>
    <button id="bReady"><span>¡LISTO!</span><kbd>Espacio</kbd></button>
  </div>
  <div id="tip" class="hidden"></div>
  <div id="pWaves" class="ipanel hidden"></div>
  <div id="pDmg" class="ipanel hidden"></div>
  <div id="pTypes" class="ipanel hidden"></div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="log"></div>
</div>

<div id="boot"><div class="bt">RIFT LEGION</div><div class="bs">Cargando la Grieta…</div></div>
<div id="end" class="hidden"><div class="ebox"><h1 id="eTitle"></h1><p id="eSub"></p><div id="eStats"></div><button id="eAgain" class="go">Volver al menú</button></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
